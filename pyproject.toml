[project]
name = "ai-guardrails-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hcdangan", email = "hcdangan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai",
    "guardrails-ai",
    "guardrails-ai-detect-pii>=0.0.6",
    "python-dotenv",
    # DetectPII loads this spaCy model on construction. Declaring it keeps the
    # install deterministic - otherwise uv sync removes it and the first
    # DetectPII call silently re-downloads ~380 MB from GitHub at runtime.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.scripts]
ai-guardrails-tutorial = "ai_guardrails_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
