[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-guardrails-tutorial"
version = "1.0.0"
description = "A tutorial on AI Guardrails - protecting LLM applications from security vulnerabilities"
authors = [
    {name = "AI Guardrails Tutorial Team"}
]
requires-python = ">=3.10"

# Core dependencies required for notebook execution
dependencies = [
    "ipykernel>=6.29.0",        # Required for running notebooks in Python environment
    "ipywidgets>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-ai>=0.0.32",
    "python-dotenv>=1.0.1",     # Required to load and read .env files
]

[project.optional-dependencies]
# Optional extras for advanced features
guardrails = ["guardrails-ai>=0.2.0"]
llms = ["litellm>=1.38.0"]
all = [
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "pydantic>=2.5.0",
    "pydantic-ai>=0.0.32",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "tabulate>=0.9.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "sentence-transformers>=2.2.0",
    "guardrails-ai>=0.2.0",
    "requests>=2.31.0",
    "unidecode>=1.3.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.16.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
